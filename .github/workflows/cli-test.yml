# Tests the README install command and the `lockin` command on a real Windows machine.
name: lockin command test
on:
  push:
    branches: [main]
    paths: ['cli/**', 'install.ps1', '.github/workflows/cli-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: lockin.ps1 parses in Windows PowerShell
        shell: powershell
        run: |
          $errs = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\cli\lockin.ps1", [ref]$null, [ref]$errs)
          if ($errs) { $errs | ForEach-Object { $_.ToString() }; throw 'parse errors' }
      - name: Install with the README command
        shell: powershell
        run: irm https://raw.githubusercontent.com/Jakedapro/Lock-in/main/install.ps1 | iex
      - name: Show where the app was installed
        if: always()
        shell: powershell
        run: |
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like 'Lock in*' | Select-Object DisplayName, DisplayVersion, InstallLocation | Format-List
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name
      - name: lockin version, update (already latest) and help
        shell: cmd
        run: |
          set PATH=%PATH%;%LOCALAPPDATA%\LockIn\bin
          call lockin version || exit /b 1
          call lockin update || exit /b 1
          call lockin help || exit /b 1
      - name: The intro runs (this commit's lockin.ps1)
        shell: powershell
        run: |
          Copy-Item cli\lockin.ps1 "$env:LOCALAPPDATA\LockIn\bin\lockin.ps1" -Force
          & "$env:LOCALAPPDATA\LockIn\bin\lockin.cmd" banner
          if ($LASTEXITCODE) { throw 'lockin banner failed' }
          & "$env:LOCALAPPDATA\LockIn\bin\lockin.cmd" exams
          if ($LASTEXITCODE) { throw 'lockin exams failed' }
          & "$env:LOCALAPPDATA\LockIn\bin\lockin.cmd" focus 1
          if ($LASTEXITCODE) { throw 'lockin focus failed' }
      - name: The lockin command is on the user PATH
        shell: powershell
        run: if (-not ([Environment]::GetEnvironmentVariable('Path','User') -split ';' -contains "$env:LOCALAPPDATA\LockIn\bin")) { throw 'not on PATH' }
