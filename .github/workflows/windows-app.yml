# Builds the Windows installer (desktop/) on a Windows machine and publishes it as a GitHub release.
# Run it by pushing a version tag, e.g.  git tag v1.0.1 && git push origin v1.0.1  (match desktop/package.json "version").
name: Windows app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
